services:
  - type: web
    name: fdr-kavach-demo-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz/
    preDeployCommand: python manage.py migrate --noinput
    dockerCommand: >-
      sh -c 'python manage.py seed_demo && exec gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 4 --timeout 120 --access-logfile -'
    disk:
      name: fdr-kavach-demo-documents
      mountPath: /app/media
      sizeGB: 1
    envVars:
      - fromGroup: fdr-kavach-demo-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: fdr-kavach-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fdr-kavach-demo-redis
          type: keyvalue
          property: connectionString
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false

  - type: worker
    name: fdr-kavach-demo-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config worker --loglevel=INFO
    envVars:
      - fromGroup: fdr-kavach-demo-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: fdr-kavach-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fdr-kavach-demo-redis
          type: keyvalue
          property: connectionString

  - type: worker
    name: fdr-kavach-demo-beat
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config beat --loglevel=INFO
    envVars:
      - fromGroup: fdr-kavach-demo-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: fdr-kavach-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fdr-kavach-demo-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: fdr-kavach-demo-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: fdr-kavach-demo-db
    region: singapore
    plan: basic-256mb
    databaseName: fdrkavach
    user: fdrkavach
    diskSizeGB: 1
    ipAllowList: []

envVarGroups:
  - name: fdr-kavach-demo-runtime
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: DOCUMENT_ENCRYPTION_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SEED_ENABLED
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: CSRF_COOKIE_SECURE
        value: "1"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: DJANGO_USE_REDIS_CACHE
        value: "1"
      - key: MEDIA_ROOT
        value: /app/media
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"